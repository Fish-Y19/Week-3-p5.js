<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Formatting to debug</title>
</head>
<body>

<h3>Green Bottles</h3>

<script>
const intGreenBottles = 10;

const arrGreenBottles = [
    ["Grolsch", "No"],
    ["Heineken", "No"],
    ["Carlsberg", "No"],
    ["Tuborg", "No"],
    ["Perrier", "No"],
    ["Peroni", "No"],
    ["Sprite", "Of course not!"],
    ["Fairy", "No"],
    ["Fructis", "No"],
    ["Tap water", "Yes!"]
];

function getBottles(arrBot, intBott) {
    for (let i = 0; i < intBott; i++) 
    {const strBottle = arrBot[i][0] + " - " + arrBot[i][1];
    if (arrBot[i][1] === "Yes!") {
        document.write("<strong>" + strBottle + "</strong><br>");
    } else {
        document.write(strBottle + "<br>");}
    }
}
document.write("<h3>Here are ten green bottles... but are they really green?</h3><p>");
getBottles(arrGreenBottles, intGreenBottles);
document.write("</p>");
</script>

</body>
</html>
